# Render Blueprint：一键部署（含免费 Postgres）
# 部署步骤见交付说明。环境变量 ADMIN_USER / ADMIN_PASS / SECRET 在平台控制台手动设置。
databases:
  - name: costmem-db
    databaseName: costmem
    user: costmem
    plan: free

services:
  - type: web
    name: costmem
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: costmem-db
          property: connectionString
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASS
        sync: false
      - key: SECRET
        sync: false
